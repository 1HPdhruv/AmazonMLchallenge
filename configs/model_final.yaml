# Final model config selected by the staged experiments (see EXPERIMENT_LOG.md).
objective: binary
entity_weighting: none
features:
  lexical: true
  idf: true
  fs: false
  address: true
  missingness: true
  retrieval: true
  relative_entity: false
  relative_record: false
idf_rare_quantile: 0.75
xgb:
  n_estimators: 400
  max_depth: 6
  eta: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  lambda: 1.0
  tree_method: hist
  nthread: 8
  seed: 7
  auto_scale_pos_weight: true
hard_negative:
  enabled: false
  folds: 3
  upweight: 3.0
  per_stratum_cap: 1500
  min_oof_score: 0.2
  no_match_min_score: 0.3
  generic_idf_quantile: 0.2
